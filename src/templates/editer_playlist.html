{% extends "base.html" %}
{% block title %}Éditer la playlist – The Wave{% endblock %}
{% block content %}
<h1>Éditer la playlist</h1>
<form method="POST" class="card">
    <label>Titre</label>
    <input name="title" value="{{ playlist.title }}" required>

    <label>Description</label>
    <textarea name="description">{{ playlist.description }}</textarea>

    <button type="submit">Enregistrer</button>
</form>
{% endblock %}
