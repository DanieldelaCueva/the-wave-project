{% extends "base.html" %}
{% block content %}
<div class="create-playlist-container">
  <h1>Supprimer une playlist</h1>

  <p>Sélectionnez la playlist à laquelle vous souhaitez ajouter le morceau:</p>

  <form method="POST" action="ajout_dans_playlist">
    <div class="form-row">
      <label class="form-label-inline"><b>Morceau :</b></label>
      <input
        type="text"
        value="{{ morceau.titre }}"
        class="form-input disabled-input"
        disabled
      />
    </div>

    <input type="hidden" name="morceau" value="{{ morceau.idmorceau }}">

    <!-- Liste déroulante avec toutes les playlists -->
    <label class="form-label" for="playlist_select"><b>Playlist :</b></label>
    <select id="playlist_select" name="idplaylist" class="playlist-select">
      {% for playlist in playlists %}
      <option value="{{ playlist.idplaylist }}">{{ playlist.titre }}</option>
      {% endfor %}
    </select>

    <button
      type="submit"
      class="add-icon"
      title="Ajouter à plalist"
      aria-label="Ajouter à plalist"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 5v14m-7-7h14"
          stroke="#7b5cff"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </form>
</div>

{% endblock %}
