{% extends "base.html" %} {% block title %}{{ album.title }} – The Wave{%
endblock %} {% block content %}

<h1>{{ album.titre }}</h1>
<p>{{ album.description }}</p>

<img
  class="album-cover"
  src="data:image/png;base64,{{ album.couverture }}"
  alt="Pochette"
/>

<h2>Morceaux</h2>
<div class="list-card-wrapper">
  {% for morceau in morceaux %}
  <a
    href="{{ url_for('morceau', idmorceau=morceau.idmorceau) }}"
    class="list-card-link"
  >
    <div class="list-card">
      <div class="list-card-info"><h3>{{ morceau.titre }}</h3></div>
      <div class="list-card-meta">
        <p>{{ morceau.duree }}</p>
        <a href="/ajouter_a_playlist/{{ morceau.idmorceau }}" class="add-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 5v14m-7-7h14"
              stroke="#7b5cff"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </a>
      </div>
    </div>
  </a>
  {% endfor %}
</div>

{% endblock %}
