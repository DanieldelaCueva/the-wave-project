{% extends "base.html" %}
{% block title %}Supprimer une playlist – The Wave{% endblock %}

{% block content %}
<div class="create-playlist-container">
<h1>Supprimer une playlist</h1>

<p>Sélectionnez la playlist que vous souhaitez supprimer :</p>

<form method="POST" action="suppression_playlist">
    
    <!-- Liste déroulante avec toutes les playlists -->
    <label for="playlist_select"><b>Playlist :</b></label>
    <select id="playlist_select" name="idplaylist_suppr" class="playlist-select">
        {% for playlist in playlists %}
            <option value="{{ playlist.idplaylist }}">
                {{ playlist.titre }}
            </option>
        {% endfor %}
    </select>

    <button type="submit" class="icon-button delete" title="Supprimer une playlist" aria-label="Supprimer une playlist" data-action="delete-playlist">
      <!-- SVG corbeille -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 6h18M8 6v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V6M10 6V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

</form>
</div>

{% endblock %}
