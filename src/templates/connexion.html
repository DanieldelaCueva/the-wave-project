{% extends "base.html" %}
{% block title %}Connexion – The Wave{% endblock %}
{% block content %}
<div class="login-wrapper">

    <div class="login-card">
        <h1 class="login-title">Connexion</h1>
        <p class="login-subtitle">Bienvenue sur <strong>The Wave</strong></p>

        {% if etat == 1 %}
        <div class="login-error">
            ❌ Utilisateur introuvable ou mot de passe incorrect.
        </div>
        {% endif %}

        <form method="POST" action="authentication">
            <label>Pseudonyme</label>
            <input type="text" name="pseudo" required>

            <label>Mot de passe</label>
            <input type="password" name="mdp" required>

            <button type="submit" class="login-button">Se connecter</button>
        </form>

        <a href="/inscription" class="login-link">Créer un compte</a>
    </div>

</div>
{% endblock %}
